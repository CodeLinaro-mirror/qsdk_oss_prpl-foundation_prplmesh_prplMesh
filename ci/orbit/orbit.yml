.orbit-on-target:
  script:
    - echo "Start Orbit testing in 30 seconds"
    - sleep 30
    - python3 -u tests/orbit/orbit.py $(echo "$CI_ORBIT_CASES_LIST" | tr ';' ' ')
  after_script:
    - timeout 10 ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${TARGET_DEVICE} "rm -f /tmp/logs.tar; tar -chf /tmp/logs.tar -C /var log"
    - timeout 10 scp -O -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${TARGET_DEVICE}:/tmp/logs.tar logs.tar
    - python3 -u tests/orbit/orbit.py --cleanup
  artifacts:
    paths:
      - "*.zip"
      - "logs.tar"
    expire_in: 4 weeks
    when: always
  rules:
    - when: manual
      allow_failure: true

.orbit-on-ospv2:
  extends: .orbit-on-target
  stage: Orbit-OSPv2
  variables:
    TARGET_DEVICE: urx_ospv2
  before_script:
    - tools/deploy_firmware.py --device "$TARGET_DEVICE" --target-name "$TARGET_DEVICE" --image "$URX_OSPV2_B_FULLIMAGE" --ipaddr "192.168.1.99" --serverip "192.168.1.178" --whm --configuration ci/configuration/orbit/urx_ospv2.sh
  needs:
    - job: build-for-ospv2
  tags:
    - orbit
    - ospv2

Orbit:OSPv2:5.1.4_connect_station_2g:
  extends: .orbit-on-ospv2
  variables:
    CI_ORBIT_CASES_LIST: "5_1_4_connect_one_station_in_2g"

