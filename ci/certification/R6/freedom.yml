R6:freedom:MAP-4.2.5:
  extends: .certification:R6:freedom
  rules:
    # If the last commit description contains the test name and we're not on master, run it.
    # Otherwise, make it a manual job
    - if: '$CI_COMMIT_DESCRIPTION =~ /.*MAP-4.2.5:freedom.*/ && $CI_COMMIT_REF_NAME != "master"'
      when: on_success
    - when: manual
      allow_failure: true

