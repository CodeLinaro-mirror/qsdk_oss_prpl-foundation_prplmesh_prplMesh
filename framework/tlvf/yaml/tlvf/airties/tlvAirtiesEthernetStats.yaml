#
---

_namespace: airties
_include:
  {
    tlvf/ieee_1905_1/sVendorOUI.h,
    tlvf/airties/eAirtiesTlvTypeMap.h,
  }

tlvAirtiesEthernetStats:
  _type: class
  _is_tlv_class: True
  type:
    _type: eAirtiesTlvTypeMap
    _value_const: TLV_VENDOR_SPECIFIC
  length: uint16_t
  vendor_oui:
    _type: sVendorOUI
  tlv_id:
    _type: uint16_t
  supported_extra_stats:
    _type: uint16_t
  num_of_ports:
    _type: uint8_t
    _length_var: True
  port_list:
    _type: cPortList
    _length: [ num_of_ports ]

cPortList:
  _type: class
  port_id:
    _type: uint8_t
  statsItem:
    _type: cStatsItem
    _length: []

cStatsItem:
  _type: class
  item:
    _type: uint8_t
    _length: [6]
