#
---

_namespace: airties
_include:
  {
    tlvf/ieee_1905_1/sVendorOUI.h,
    tlvf/airties/eAirtiesTlvTypeMap.h,
    tlvf/common/sMacAddr.h,
  }

tlvAirtiesRadioCapability:
  _type: class
  _is_tlv_class: True
  type:
    _type: eAirtiesTlvTypeMap
    _value_const: TLV_VENDOR_SPECIFIC
  length: uint16_t
  vendor_oui:
    _type: sVendorOUI
  tlv_id:
    _type: uint16_t
  radio_id:
    _type: sMacAddr
  standards:
    _type: sStandards
  standards_reserved: uint8_t
  reserved: uint16_t

sStandards:
  _type: struct
  _bit_field: uint8_t
  s_80211a:
    _bit_range: [7,7]
  s_80211b:
    _bit_range: [6,6]
  s_80211g:
    _bit_range: [5,5]
  s_80211n:
    _bit_range: [4,4]
  s_80211ac:
    _bit_range: [3,3]
  s_80211ax:
    _bit_range: [2,2]
  s_80211be:
    _bit_range: [1,1]
  reserved:
    _bit_range: [0,0]
